name: Verificação Pós-Deploy

# Fires after anything lands on the production branch. Cloudflare Workers
# builds automatically on push (that's the actual "deploy" — see
# README.md#hosting--deployment); this job waits a bit for that build to
# finish, then smoke-tests the LIVE site. If it's broken, this is the one
# workflow in the project allowed to auto-revert (see auditor/postdeploy.mjs
# for why).
on:
  push:
    branches: [glctech2.0]

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: https://glctech.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: glctech2.0

      - name: Aguardar build do Cloudflare Workers
        run: sleep 90

      - name: Smoke test + revert automático se necessário
        run: node auditor/postdeploy.mjs
