name: Auditoria Mensal do Site (consolidação)

on:
  schedule:
    # Primeiro dia de cada mês, 07:00 UTC — depois que a auditoria semanal
    # dessa semana já rodou.
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Mês a consolidar (AAAA-MM). Vazio = mês atual."
        required: false

permissions:
  contents: write

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
      ZOHO_SMTP_PASS: ${{ secrets.ZOHO_SMTP_PASS }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install --omit=optional --ignore-scripts

      - name: Gerar e enviar relatório mensal
        run: node auditor/monthly.mjs ${{ inputs.month }} --email

      - name: Upload do relatório como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-report-${{ github.run_id }}
          path: reports/monthly/*.md
          retention-days: 365
