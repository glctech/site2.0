name = "site2-0"
main = "_worker.js"
compatibility_date = "2025-06-01"

# Serves the whole repo as static files (index.html, css/, js/, images, etc.),
# same as today. Anything not matched by a route in _worker.js falls through
# to this binding.
[assets]
directory = "."
binding = "ASSETS"

# ── Secrets (Settings → Variables and Secrets → Runtime, in the dashboard) ──
# ZOHO_SMTP_USER, ZOHO_SMTP_PASS  — required, see docs/INTEGRATIONS.md
# ZOHO_MAIL_TO_CONTATO, ZOHO_MAIL_TO_RH — optional overrides
# ZABBIX_URL, ZABBIX_USER, ZABBIX_PASS  — optional, for live /api/stats
#
# IMPORTANT: these must be added as RUNTIME variables/secrets on this Worker
# (the same "Variáveis e segredos" panel that becomes available once this
# Worker has real code, i.e. after this wrangler.toml + _worker.js ship) —
# NOT the "Build" variables panel, which only exists for the build step and
# is invisible to the running Worker.
