name = 'shy-river-6fc7'
main = "_worker.js"
compatibility_date = "2025-06-01"

# Serves the whole repo as static files (index.html, css/, js/, images, etc.),
# same as today. Anything not matched by a route in _worker.js falls through
# to this binding.
[assets]
directory = "."
binding = "ASSETS"

# ── Newsletter (Boletim GLCTech) — see docs/NEWSLETTER.md ──────────────────
# ATENÇÃO: este binding fica COMENTADO até o banco D1 real existir. Um
# database_id inválido/placeholder faz o `wrangler deploy` do Cloudflare
# Workers Builds falhar para TODO o Worker (não só as rotas de newsletter) —
# já aconteceu neste PR. Depois de rodar `wrangler d1 create glctech-newsletter`,
# descomente as 4 linhas abaixo e cole o database_id real.
# [[d1_databases]]
# binding = "DB"
# database_name = "glctech-newsletter"
# database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[triggers]
crons = ["0 11 * * 1"]   # segunda-feira 11:00 UTC (08:00 em São Paulo, UTC-3)

[vars]
# Base pública do site — usada só como texto/branding nos e-mails (ex.:
# "você se inscreveu em glctech.com.br"), NUNCA para montar links de
# confirmar/descadastrar/aprovar (ver WORKER_URL abaixo e docs/NEWSLETTER.md
# sobre por que — resumo: glctech.com.br é servido por outra infraestrutura
# que não roteia /api/* para este Worker ainda).
SITE_URL          = "https://glctech.com.br"
# Domínio real deste Worker — é para cá que os links funcionais
# (confirmar/descadastrar/aprovar) devem apontar. Mesmo domínio que
# send-email.js já usa para contornar o CDN em frente a glctech.com.br
# (ver docs/INTEGRATIONS.md). Atualizar aqui SE esse domínio mudar.
WORKER_URL        = "https://site2-0.aluiz-cez.workers.dev"
ADMIN_EMAIL       = "contato@glctech.com.br"
ANTHROPIC_MODEL   = "claude-sonnet-5"

# ── Modo de teste — enquanto true, TODO envio da newsletter (não a confirmação
# de inscrição em si) vai só para TEST_RECIPIENT, nunca para a lista real.
# Ver "Plano de teste" em docs/NEWSLETTER.md antes de mudar para "false".
TEST_MODE         = "true"
TEST_RECIPIENT    = "contato@glctech.com.br"

# ── Secrets (Settings → Variables and Secrets → Runtime, in the dashboard) ──
# ZOHO_SMTP_USER, ZOHO_SMTP_PASS  — required, see docs/INTEGRATIONS.md
# ZOHO_MAIL_TO_CONTATO, ZOHO_MAIL_TO_RH — optional overrides
# ZABBIX_URL, ZABBIX_USER, ZABBIX_PASS  — optional, for live /api/stats
# ANTHROPIC_API_KEY — required for the newsletter agent, see docs/NEWSLETTER.md
# HMAC_SECRET       — required for the newsletter, openssl rand -hex 32
# ADMIN_TOKEN       — required for the newsletter, openssl rand -hex 32
#
# IMPORTANT: these must be added as RUNTIME variables/secrets on this Worker
# (the same "Variáveis e segredos" panel that becomes available once this
# Worker has real code, i.e. after this wrangler.toml + _worker.js ship) —
# NOT the "Build" variables panel, which only exists for the build step and
# is invisible to the running Worker.
